    <!-- Script JavaScript per gestire il quiz, i filtri e il cambio in "Fine" sull'ultima domanda -->
    <script>
let questions = [];
let currentIndex = 0;
let userAnswers = {};

window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('Esame.csv');
                if (!response.ok) throw new Error("File Esame.csv non trovato");
                const data = await response.text();

                const urlParams = new URLSearchParams(window.location.search);
                const selectedMateria = urlParams.get('materia');

                if (selectedMateria) {
                    document.getElementById('materiaLabel').innerText = "Materia: " + decodeURIComponent(selectedMateria);
                } else {
                    document.getElementById('materiaLabel').innerText = "Simulazione Esame Completa";
                }

                parseCSV(data, selectedMateria);
                loadQuestion(currentIndex);
            } catch (error) {
                document.getElementById('questionText').innerText = "Errore nel caricamento delle domande dal file CSV.";
                console.error(error);
            }
});

function parseCSV(text, filterMateria) {
            const lines = text.split('\n');
            questions = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = line.split(',');
                if (cols.length >= 7) {
                    const materiaCol = cols[6].trim().replace(/^"|"$/g, '');

                    if (filterMateria && materiaCol.toLowerCase() !== decodeURIComponent(filterMateria).toLowerCase()) {
                        continue;
                    }

                    questions.push({
                        id: questions.length + 1,
                        question: cols[0].trim().replace(/^"|"$/g, ''),
                        options: [
                            cols[1].trim().replace(/^"|"$/g, ''),
                            cols[2].trim().replace(/^"|"$/g, ''),
                            cols[3].trim().replace(/^"|"$/g, ''),
                            cols[4].trim().replace(/^"|"$/g, '')
                        ],
                        solution: cols[5].trim().replace(/^"|"$/g, ''),
                        materia: materiaCol
                    });
                }
            }

            if (questions.length === 0) {
                document.getElementById('questionText').innerText = filterMateria
                    ? `Nessuna domanda trovata per la materia: ${filterMateria}`
                    : "Nessuna domanda trovata nel file CSV.";
                return;
            }

            questions = questions.sort(() => Math.random() - 0.5).slice(0, 30);
}

function loadQuestion(index) {
            if (questions.length === 0) return;

            if (index >= questions.length) {
                showResults();
                return;
            }

            const q = questions[index];
            document.getElementById('questionText').innerText = `Domanda ${index + 1} di ${questions.length}: ${q.question}`;

            // Gestione del bottone Avanti / Fine sull'ultima domanda
            const nextBtn = document.getElementById('nextBtn');
            if (index === questions.length - 1) {
                nextBtn.innerText = "Fine";
                nextBtn.classList.remove('btn-warning');
                nextBtn.classList.add('btn-success');
            } else {
                nextBtn.innerText = "Avanti";
                nextBtn.classList.remove('btn-success');
                nextBtn.classList.add('btn-warning');
            }

            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                const optBtn = document.getElementById(`opt${i}`);
                if (optBtn) {
                    const spanText = optBtn.querySelector('.option-text');
                    if (spanText) {
                        spanText.innerText = shuffledOptions[i];
                    }

                    optBtn.classList.remove('btn-warning');
                    optBtn.classList.add('btn-primary');

                    if (userAnswers[q.id] === shuffledOptions[i]) {
                        optBtn.classList.remove('btn-primary');
                        optBtn.classList.add('btn-warning');
                    }

                    optBtn.onclick = (e) => {
                        e.preventDefault();
                        userAnswers[q.id] = shuffledOptions[i];
                        for (let j = 0; j < 4; j++) {
                            document.getElementById(`opt${j}`).classList.remove('btn-warning');
                            document.getElementById(`opt${j}`).classList.add('btn-primary');
                        }
                        optBtn.classList.remove('btn-primary');
                        optBtn.classList.add('btn-warning');
                    };
                }
            }
}

document.getElementById('nextBtn').addEventListener('click', (e) => {
            e.preventDefault();
            currentIndex++;
            loadQuestion(currentIndex);
});

document.getElementById('prevBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
            }
});

function showResults() {
            let correct = 0;
            let mistakesHTML = "";

            questions.forEach(q => {
                const userAns = userAnswers[q.id];
                if (userAns && userAns.toLowerCase() === q.solution.toLowerCase()) {
                    correct++;
                } else {
                    mistakesHTML += `<p><b>Domanda:</b> ${q.question}<br><b>Tua risposta:</b> ${userAns || 'Nessuna'}<br><b>Risposta corretta:</b> ${q.solution}</p><hr>`;
                }
            });

            const container = document.querySelector('.quiz-container');
            container.innerHTML = `
                <h2 class="mbr-section-title mbr-fonts-style display-2 text-center text-white">Test Completato!</h2>
                <p class="mbr-text mbr-fonts-style display-7 text-center text-white mt-3">Punteggio finale: <b>${correct} / ${questions.length}</b></p>
                <h3 class="mbr-fonts-style display-5 text-warning mt-4 text-center">Riepilogo Errori:</h3>
                <div class="text-start text-white mt-3 p-3" style="max-height: 350px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 8px;">${mistakesHTML || '<p class="text-center">Complimenti, nessun errore!</p>'}</div>
                <div class="text-center mt-4">
                    <a href="index.html" class="btn btn-warning display-7">Torna alla Home</a>
                </div>
            `;
}
    </script>
