  <script>
    async function loadQuestion() {
      const questionEl = document.getElementById('questionText');
      try {
        const resp = await fetch('/api/exam/questions');
        if (!resp.ok) {
          throw new Error('Fetch error ' + resp.status);
        }

        const data = await resp.json();
        if (!Array.isArray(data) || data.length === 0) {
          if (questionEl) questionEl.textContent = 'Nessuna domanda disponibile.';
          return;
        }

        const q = data[0] || {};
        if (questionEl) questionEl.textContent = q.question || 'Domanda mancante';

        for (let i = 0; i < 4; i++) {
          const optEl = document.getElementById('opt' + i);
          if (!optEl) continue;

          const txt = Array.isArray(q.options) && q.options[i] ? q.options[i] : '';
          const span = optEl.querySelector('.option-text');
          if (span) span.textContent = txt || ('Risposta ' + (i + 1));
          optEl.setAttribute('data-value', txt);
        }
      } catch (err) {
        console.error(err);
        if (questionEl) questionEl.textContent = 'Errore caricamento domanda.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadQuestion);
  </script>
