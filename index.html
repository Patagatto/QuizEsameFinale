<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Game Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#131f24; --card:#16252c; --surf:#1b2c34; --hover:#20333c; --ink:#f1f7fb; --mute:#8fa3ad; --line:#37464f; --line2:#2a3a42;
  --green:#58cc02; --green-d:#46a302; --green-l:#1f3b17; --green-t:#79e33a;
  --red:#ff4b4b; --red-d:#c22f2f; --red-l:#3d1d22; --red-t:#ff7878;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#13324a; --blue-t:#49c0f8; --blue-b:#1f6d96;
  --gold:#ffc800; --gold-d:#d9a400; --gold-l:#3a3214; --orange:#ff9600; --orange-l:#3d2a12; --purple:#ce82ff; --purple-l:#33244a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit;font-weight:800;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:900;font-size:20px;color:var(--green);letter-spacing:-.5px;flex:1;cursor:pointer;user-select:none}
.pill{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px}
.pill .ic{font-size:20px}
.pill.fire{color:var(--orange)} .pill.xp{color:var(--gold)} .pill.ok{color:var(--green-t)}
/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:26px;font-weight:900;margin:6px 0 4px}
h2{font-size:19px;font-weight:900;margin:0 0 10px}
.sub{color:var(--mute);font-weight:700;font-size:14px}
.btn{border:none;border-radius:14px;padding:13px 18px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .05s,filter .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:hover{filter:brightness(1.05)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#5a4300}
.btn.ghost{background:var(--surf);color:var(--blue-t);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.full{width:100%}
.btn:disabled{background:var(--line);color:#6f818a;box-shadow:0 4px 0 var(--line2);cursor:default}
/* level */
.lvl{display:flex;align-items:center;gap:14px}
.badge-lvl{width:62px;height:62px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:inset 0 -5px 0 var(--gold-d);flex:none}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .5s}
.bar>i::after{content:"";display:block;height:5px;margin:3px 8px 0;border-radius:9px;background:rgba(255,255,255,.35)}
.bar.gold>i{background:var(--gold)} .bar.blue>i{background:var(--blue)}
/* stat grid */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.stat .ic{font-size:26px}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;color:var(--mute)}
.hero-num{font-size:44px;font-weight:900;color:var(--green);line-height:1}
/* modes */
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--card);cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:left;width:100%;color:var(--ink)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .mi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.mode b{font-size:17px;font-weight:900;display:block}
.mode span{font-size:13px;color:var(--mute);font-weight:700}
/* daily ring */
.daily{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
/* subject list */
.subj{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);cursor:pointer;width:100%;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.subj:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.subj .crown{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;background:var(--line)}
.subj .t{flex:1;min-width:0}
.subj .t b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj .t small{color:var(--mute);font-size:12px}
.subj .bar{height:10px;margin-top:5px}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;margin-bottom:12px;background:var(--surf);color:var(--ink)}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x{background:none;border:none;font-size:26px;color:#6f818a;padding:0 4px}
.qhead .bar{flex:1}
.timer{font-weight:900;font-size:16px;padding:6px 12px;border-radius:12px;background:var(--blue-l);color:var(--blue-t);font-variant-numeric:tabular-nums}
.timer.low{background:var(--red-l);color:var(--red-t);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hearts{color:var(--red);font-weight:900;font-size:17px}
.qsubj{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--purple);font-weight:900;margin-bottom:6px}
.qtext{font-size:20px;font-weight:800;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card);font-size:15px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--line);line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.opt:hover{background:var(--hover)}
.opt.sel{border-color:var(--blue-b);background:var(--blue-l);color:var(--blue-t);box-shadow:0 3px 0 var(--blue-b)}
.opt.sel .k{border-color:var(--blue-b);color:var(--blue-t)}
.opt.good{border-color:var(--green);background:var(--green-l);color:var(--green-t);box-shadow:0 3px 0 var(--green)}
.opt.good .k{border-color:var(--green);color:var(--green-t)}
.opt.bad{border-color:var(--red);background:var(--red-l);color:var(--red-t);box-shadow:0 3px 0 var(--red)}
.opt.bad .k{border-color:var(--red);color:var(--red-t)}
.opt:disabled{cursor:default}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:18px}
.grid button{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-size:12px;color:var(--mute)}
.grid button.ans{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-t)}
.grid button.cur{outline:3px solid var(--gold)}
.grid button.g{background:var(--green-l);border-color:var(--green);color:var(--green-t)}
.grid button.r{background:var(--red-l);border-color:var(--red);color:var(--red-t)}
.navrow{display:flex;gap:10px;margin-top:16px}
.navrow .btn{flex:1}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 16px 22px;transform:translateY(110%);transition:transform .22s ease;z-index:20}
.sheet.show{transform:none}
.sheet.ok{background:var(--green-l)} .sheet.ko{background:var(--red-l)}
.sheet .in{max-width:760px;margin:0 auto}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:900}
.sheet.ok h3{color:var(--green-t)} .sheet.ko h3{color:var(--red-t)}
.sheet p{margin:0 0 12px;font-size:14px}
.sheet.ko p{color:var(--red-t)}
.combo{display:inline-block;margin-left:8px;font-size:14px;background:var(--orange);color:#fff;border-radius:99px;padding:2px 10px;vertical-align:middle}
/* results */
.result{text-align:center}
.result .big{font-size:64px;line-height:1;margin:10px 0}
.reward{display:flex;gap:10px;justify-content:center;margin:16px 0}
.reward div{border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-width:96px}
.reward b{display:block;font-size:22px;font-weight:900}
.reward span{font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.6px}
.rev{text-align:left;border-top:2px solid var(--line);padding:12px 0}
.rev .q{font-weight:800;margin-bottom:6px}
.rev .a{font-size:14px;padding:2px 0}
.rev .a.g{color:var(--green-t)} .rev .a.r{color:var(--red-t);text-decoration:line-through}
.chip{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;background:var(--line);color:var(--mute);margin-right:6px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bdg{text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px 6px;font-size:12px}
.bdg .e{font-size:32px;display:block;margin-bottom:4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg small{display:block;color:var(--mute);font-weight:700;font-size:11px;margin-top:2px}
.tabs{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute)}
.tabs button.on{border-color:var(--blue-b);background:var(--blue-l);color:var(--blue-t)}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid var(--line);font-size:14px}
.ok-t{color:var(--green-t)} .ko-t{color:var(--red-t)}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);background:var(--surf);border:2px solid var(--gold);border-radius:16px;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:50;transition:transform .3s;box-shadow:0 6px 0 var(--gold-d);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast .e{font-size:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.toggle{background:none;border:none;font-size:20px;padding:0}
.tiermedal{width:110px;height:110px;margin:6px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 35%,transparent),transparent 70%);border:4px solid var(--tc);box-shadow:0 0 30px color-mix(in srgb,var(--tc) 45%,transparent);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.ladder div{border:2px solid var(--line);border-radius:12px;padding:8px 2px;opacity:.45;font-size:11px}
.ladder div span{display:block;font-size:22px}
.ladder div b{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder div small{color:var(--mute);font-size:10px}
.ladder div.on{opacity:1;border-color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent);transform:scale(1.08)}
.tierrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tierchip{border:2px solid;border-radius:12px;text-align:center;padding:6px 2px;font-size:11px}
.tierchip span{font-size:20px;display:block}.tierchip b{display:block;font-size:17px}.tierchip small{color:var(--mute);font-size:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 20%,transparent);flex:none}
.avbtn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink);padding:0}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.pcard{border:2px solid var(--line);border-radius:20px;padding:20px 12px;background:var(--card);text-align:center;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.pcard:hover{border-color:var(--pc);box-shadow:0 5px 0 var(--pc)}
.pcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pc)}
.pcard.cur{border-color:var(--pc);box-shadow:0 5px 0 var(--pc)}
.pcard .big-av{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:46px;border:4px solid var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.pcard b{font-size:20px;font-weight:900;display:block}
.pcard small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.vs{margin-top:18px}
.vs .r{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:2px solid var(--line);font-size:15px}
.vs .r span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.6px;text-align:center}
.vs .r b{font-weight:900}.vs .r b:first-child{text-align:right}
.vs .w{color:var(--gold)}
@media (max-width:520px){.ladder,.tierrow{grid-template-columns:repeat(3,1fr)}
  .qtext{font-size:18px}.grid{grid-template-columns:repeat(6,1fr)}h1{font-size:22px}
  .pill{font-size:14px}.pill .ic{font-size:17px}.logo{font-size:17px}
}
</style>
</head>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="wrap">

</div>

const DATA = {"subjects":[{"name":"Orientamento finanziario","doc":"Daniele Di Girolamo"},{"name":"Aspetti legali","doc":"Anna Lisa Putorti"},{"name":"Sicurezza sul lavoro","doc":"Matteo Frollano"},{"name":"Fondamenti di marketing videoludico","doc":"Raoul William Braghieri"},{"name":"Comunicazione col cliente","doc":"Daniele Coscarella"},{"name":"Il mercato dei videogiochi","doc":"Filippo Facchetti"},{"name":"Sviluppo della carriera e dell'autoimprenditorialità","doc":"Cristiano Sprega"},{"name":"Distribuzione videoludica","doc":"Gaia Di Labio"},{"name":"Storia ed evoluzione del videogioco","doc":"Filippo Facchetti"},{"name":"Fondamenti di Game Design II","doc":"Lorenzo Lezzi"},{"name":"Game Design Framework and Techniques","doc":"Lorenzo Lezzi"},{"name":"Laboratorio di Game Design","doc":"Lorenzo Lezzi"},{"name":"Matematica","doc":"Abdellaoui Ouisem"},{"name":"Basi Adobe Photoshop e Adobe Illustrator","doc":"Roberto Frusteri"},{"name":"Ui Graphics per il gaming","doc":"Mariangela Lonigro"},{"name":"AI per il gaming","doc":"Federico Facchini"},{"name":"Character Design","doc":"Valentina Faloni"},{"name":"Introduzione ad Unreal Engine","doc":"Mariangela Lonigro"},{"name":"Programmazione in Blueprint in Unreal Engine","doc":"Francesco Sapio"},{"name":"Programmazione in C++ in Unreal Engine","doc":"Nicolò Meduri"},{"name":"Technical Animation in Unreal Engine","doc":"Alberto Virzì"},{"name":"Progettazione di Environment in Unreal Engine","doc":"Mariangela Lonigro"},{"name":"La gestione dei progetti di sviluppo gaming","doc":"Francesco Sapio"},{"name":"Motion Capture","doc":"Mariangela Lonigro"},{"name":"Progettazione di Metasound in Unreal Engine","doc":"Jacopo Carreras"},{"name":"Unità didattica professionalizzante in lingua inglese","doc":"Filippo Facchetti"},{"name":"Import Pipeline","doc":"Simone Martolini"},{"name":"3D Modeling","doc":"Simone Martolini"},{"name":"Inglese","doc":""},{"name":"Programmazione di base","doc":"Francesco Sapio"},{"name":"Pipelines in Un ke delle luci?","o":["Fantastic Lights","GPU Lightmass","CPU Lightmass","GPU Lightmixer"],"c":[1]},{"s":21,"q":"Quale tipo di \"Actor\" è spesso usato per aggiungere dettagli superficiali come pozzanghere, impronte o graffiti su altre superfici?","o":["Static Mesh Actor","Skeletal Mesh Actor","Decal Actor","Cine Camera Actor"],"c":[2]},{"s":21,"q":"Per controllare gli asset posizionati con il Foliage Tool, quali di queste impostazioni sono disponibili?","o":["Solo il colore dell'asset.","Solo la visibilità dell'asset.","Densità, Allineamento alla Normale, Scaling (min/max), Rotazione (min/max), e Collision.","Il numero di poligoni dell'asset."],"c":[2]},{"s":21,"q":"Quale tra queste è una impostazione di \"Post Process Volume\"?","o":["\"Mesh Settings\"","\"Navigation Mesh\"","\"Rendering Features\" (es. Bloom, Vignette, Color Grading, Volumetric Fog).","\"Audio Settings\""],"c":[2]},{"s":21,"q":"Se si vuole creare un nuovo livello da zero, cosa possiamo utilizzare per inserire le luci dell’ambiente in modo veloce e preciso?","o":["Env. Mixer","Env. World Mixer","Env. Level Mixer","Env. Light Mixer"],"c":[3]},{"s":22,"q":"Qual è il ruolo principale del Version Control System nella gestione dei progetti su Unreal Engine?","o":["Il Version Control System (VCS) è un plugin di Unreal Engine che automatizza la creazione di asset 3D.","Il Version Control System (VCS) serve esclusivamente a comprimere i file di progetto per ridurne le dimensioni.","Il Version Control System (VCS) permette a più sviluppatori di lavorare simultaneamente sullo stesso progetto senza sovrascrivere il lavoro altrui.","Il Version Control System (VCS) è superfluo per i progetti Unreal Engine, dato che il motore gestisce automaticamente i backup."],"c":[2]},{"s":22,"q":"Quali sono i sistemi di controllo versione più comuni utilizzati con Unreal Engine e per quali scenari sono tipicamente raccomandati?","o":["Solo SVN (Subversion) è ufficialmente supportato da Unreal Engine per il controllo versione.","Git è generalmente preferito per i progetti di piccole e medie dimensioni grazie alla sua natura distribuita, mentre Perforce è spesso scelto per progetti AAA con team numerosi e grandi quantità di file binari.","Perforce è la scelta ideale per tutti i tipi di progetti Unreal Engine, indipendentemente dalle dimensioni del team o dalla natura degli asset.","Nessun sistema di controllo versione esterno è necessario, in quanto Unreal Engine ha un sistema di controllo versione integrato che gestisce autonomamente tutti gli asset."],"c":[1]},{"s":22,"q":"Come si gestiscono gli asset di grandi dimensioni (es. texture, mesh) all'interno di un sistema di controllo versione per un progetto Unreal Engine?","o":["È buona pratica includere tutti gli asset binari nel controllo versione, utilizzando soluzioni come Git LFS per Git o le funzionalità native di Perforce per la gestione di file di grandi dimensioni.","Unreal Engine comprime automaticamente gli asset binari per facilitarne l'inclusione in qualsiasi VCS, senza bisogno di strumenti aggiuntivi.","Gli asset binari di Unreal Engine, come texture e mesh, devono essere esclusi dal controllo versione per evitare rallentamenti.","Gli asset binari devono essere archiviati su un drive di rete separato e non essere mai sottoposti a controllo versione."],"c":[0]},{"s":22,"q":"Come si gestiscono i conflitti di unione (merge conflicts) in un progetto Unreal Engine che utilizza il controllo versione?","o":["I conflitti sorgono quando due sviluppatori modificano lo stesso asset o la stessa linea di codice. Si risolvono manualmente, unendo le modifiche con strumenti forniti dal VCS o dall'IDE di Unreal Engine (es. 'Merge Tool').","Unreal Engine risolve automaticamente i conflitti senza intervento manuale, privilegiando sempre la versione più recente.","I conflitti in Unreal Engine si risolvono sempre sovrascrivendo la versione del proprio collega con la propria.","Per evitare conflitti, è sufficiente che ogni sviluppatore lavori su un file diverso del progetto."],"c":[0]},{"s":22,"q":"Qual è la considerazione più importante per il controllo versione quando si decide di cambiare la versione di Unreal Engine utilizzata in un progetto?","o":["È buona pratica aggiornare la versione del motore solo dopo aver completato l'intero progetto, per evitare problemi di compatibilità.","Il controllo versione non ha alcun impatto sui cambiamenti di versione del motore, dato che gestisce solo i file di progetto.","Quando si cambia versione del motore, è cruciale aggiornare tutti gli sviluppatori alla stessa versione e verificare la compatibilità del progetto, risolvendo eventuali problemi di migrazione con il controllo versione.","Il controllo versione gestisce automaticamente l'aggiornamento del motore, quindi non è necessario alcun intervento manuale."],"c":[2]},{"s":22,"q":"Il \"Fail Fast\" nell'Agile Game Development. Nel contesto dello sviluppo Agile di videogiochi, cosa significa il principio \"Fail Fast\" (Fallire Velocemente) e perché è considerato un vantaggio?","o":["Significa cancellare il progetto al primo bug significativo per evitare perdite economiche.","Significa testare le idee di gameplay o le meccaniche di base il prima possibile, anche con prototipi grezzi, per scoprire se sono divertenti o funzionali prima di investirci troppo tempo e risorse.","Si riferisce a una strategia di marketing che prevede di lanciare il gioco in accesso anticipato (Early Access) senza alcun test interno.","È una tecnica per cui gli sviluppatori ignorano deliberatamente gli errori di codice per accelerare la produzione, pianificando di correggerli tutti solo alla fine."],"c":[1]},{"s":22,"q":"Il Ruolo dello Scrum Master.In un team di sviluppo di videogiochi che usa Scrum, quale è la responsabilità principale dello Scrum Master durante una Sprint Review?","o":["Decidere quali elementi del Product Backlog verranno sviluppati nella prossima Sprint.","Presentare l'incremento del gioco agli stakeholder e raccogliere il loro feedback.","Assicurarsi che l'evento si svolga correttamente, che sia mantenuto entro i limiti di tempo (time-box) e che tutti i partecipanti comprendano il suo scopo, facilitando la collaborazione.","Valutare la performance individuale di ogni membro del team di sviluppo e assegnare i compiti per la settimana successiva."],"c":[2]},{"s":22,"q":"Gestione del Flusso con Kanban.Un team di artisti che lavora alla creazione di asset per un videogioco decide di adottare Kanban. Quale pratica è fondamentale per implementare Kanban in modo efficace e prevenire sovraccarichi di lavoro?","o":["Creare una lista di tutti gli asset da produrre all'inizio del progetto e assegnarli immediatamente a ogni artista.","Introdurre limiti al \"Work In Progress\" (WIP) per ogni colonna della bacheca Kanban (es. \"Bozzetto\", \"Modellazione 3D\", \"Texturing\").","Eliminare tutte le scadenze per promuovere un ambiente di lavoro senza stress.","Svolgere una riunione di pianificazione dettagliata ogni due settimane per definire il lavoro futuro."],"c":[1]},{"s":22,"q":"Differenza Chiave tra Scrum e Kanban. Quale delle seguenti affermazioni descrive una differenza fondamentale tra l'approccio di Scrum e quello di Kanban nella gestione della produzione?","o":["Scrum è adatto solo per team di programmatori, mentre Kanban è progettato esclusivamente per team di artisti e game designer.","Scrum opera in iterazioni di lunghezza fissa (Sprint) con un impegno definito di lavoro, mentre Kanban si concentra su un flusso continuo e non ha interazioni prescritte.","In Scrum non è permesso cambiare il lavoro pianificato durante una Sprint, mentre in Kanban le priorità possono essere cambiate più volte al giorno senza alcun impatto.","Kanban richiede ruoli specifici come il \"Kanban Master\" e il \"Product Owner\", mentre Scrum non ha ruoli predefiniti."],"c":[1]},{"s":22,"q":"Il Product Backlog in un Progetto di Gioco. In un progetto di videogioco gestito con Scrum, il Product Backlog è meglio descritto come:","o":["Un elenco statico e immutabile di tutte le funzionalità del gioco, approvato all'inizio del progetto e usato come una checklist.","Un documento tecnico che contiene solo le specifiche dettagliate per i programmatori, escludendo gli aspetti di design e artistici.","Una lista ordinata e dinamica di tutto ciò che è noto essere necessario per il gioco. È la singola fonte di requisiti per qualsiasi cambiamento da apportare al prodotto.","L'elenco dei compiti assegnati al team di sviluppo per la Sprint corrente."],"c":[2]},{"s":23,"q":"Qual è uno dei principali vantaggi di un sistema ottico per il Motion Capture rispetto ad altre tecnologie?","o":["Costo estremamente basso per sistemi professionali.","Non richiede alcuna calibrazione iniziale.","Alta precisione e bassa latenza grazie al tracciamento ottico marker-based.","Permette il tracciamento di oggetti invisibili."],"c":[2]},{"s":23,"q":"Quale componente hardware è fondamentale in un sistema Optitrack per catturare i movimenti?","o":["Un guanto aptico.","Un visore VR","Telecamere","Un sensore di pressione"],"c":[2]},{"s":23,"q":"In Unreal Engine, quale plugin è tipicamente utilizzato per importare e gestire i dati di Motion Capture in tempo reale da Optitrack","o":["Datasmith","V-Ray","Live Link","Motion Importer"],"c":[2]},{"s":23,"q":"Prima di iniziare una sessione di Motion Capture con Optitrack, quale operazione è cruciale per garantire la precisione dei dati?","o":["Effettuare la calibrazione del sistema e del volume di cattura.","Indossare abiti di colore chiaro.","Spegnere tutte le luci nella stanza.","Iniziare immediatamente a registrare senza preparazione."],"c":[0]},{"s":23,"q":"Quale delle seguenti affermazioni descrive meglio l'utilità di Unreal Engine in un workflow di Motion Capture con Optitrack?","o":["Serve esclusivamente per il rendering finale del filmato catturato.","Permette la visualizzazione in tempo reale, la retargeting su un personaggio 3D e l'integrazione degli animazione nel contesto di una scena virtuale.","È utilizzato solo per la creazione di modelli 3D di oggetti inanimati.","È un software di editing video per post-produzione."],"c":[1]},{"s":23,"q":"Qual è il principio di funzionamento principale dei sistemi di motion capture come OptiTrack?","o":["Registrazione di onde sonore","Rilevamento di segnali GPS","Tracciamento di marcatori passivi o attivi tramite telecamere a infrarossi","Analisi di immagini 2D"],"c":[2]},{"s":23,"q":"A cosa serve il processo di \"calibrazione\" in un sistema OptiTrack?","o":["A regolare la luminosità delle telecamere.","A definire il volume di cattura e a determinare la posizione esatta di ogni telecamera nello spazio 3D.","A bilanciare il peso dei marcatori.","A sincronizzare l'audio con il movimento."],"c":[1]},{"s":23,"q":"Quale software di motion capture è comunemente utilizzato con i sistemi OptiTrack?","o":["Motive","Adobe After Effects","Autodesk Maya","Blender"],"c":[0]},{"s":23,"q":"Per ottenere una cattura di alta qualità, cosa è fondamentale evitare nell'ambiente di lavoro?","o":["Troppa luce naturale.","Riflessi o fonti di luce a infrarossi che possono confondere le telecamere.","Pavimenti in moquette.","Pareti bianche."],"c":[1]},{"s":23,"q":"A cosa si riferisce il termine \"Occlusion\" in motion capture?","o":["La distorsione del segnale.","Quando un marcatore è bloccato alla vista di tutte le telecamere da un'altra parte del corpo o da un oggetto, causando una perdita di dati.","Un tipo di errore nella calibrazione","La sovrapposizione di due movimenti."],"c":[1]},{"s":23,"q":"Cosa si intende per \"Noise\" (rumore) nei dati di motion capture?","o":["I suoni registrati durante la sessione.","I movimenti del corpo non previsti.","La luminosità ambientale.","I dati non corretti o le piccole fluttuazioni nei dati di posizione dei marcatori, che non corrispondono al movimento reale."],"c":[3]},{"s":23,"q":"A cosa serve un \"rigid body\" in OptiTrack Motive?","o":["A calibrare i movimenti del corpo.","A raggruppare un set di marcatori in un unico oggetto solido e tracciabile, come una spada o un casco.","A registrare la rigidità muscolare.","A creare un modello di personaggio."],"c":[1]},{"s":24,"q":"Spiega la frequenza di campionamento: Se vogliamo catturare una frequenza di 20kHz, qual è la frequenza di campionamento minima richiesta e cosa accade se la frequenza del segnale supera la metà della frequenza di campionamento?","o":["20kHz","40kHz","48kHz, ma solo se il bit depth è 24-bit"],"c":[1]},{"s":24,"q":"Bit Depth vs. Gamma Dinamica: In che modo l'aumento della profondità di bit (es. da 16-bit a 24-bit) influisce sul \"Noise Floor\" (rumore di fondo) e qual è la relazione matematica approssimativa tra bit e Decibel (dB)?","o":["Un aumento della risposta in frequenza sopra i 20kHz","Un aumento della gamma dinamica e un abbassamento del rumore di fondo","Una riduzione della latenza di elaborazione della CPU"],"c":[1]},{"s":24,"q":"Percorso del Segnale: Descrivi brevemente il ruolo di un DAC (Convertitore Digitale-Analogico) nel contesto dell'output audio di un motore di gioco verso le cuffie dell'utente.","o":["Converte i campioni binari/tensione digitale in tensione analogica per gli altoparlanti.","Comprimere i file audio in formato MP3 per risparmiare spazio su disco","Analizzare la frequenza fondamentale di un segnale in ingresso"],"c":[0]},{"s":24,"q":"Audio in Virgola Mobile (Floating Point): Unreal Engine elabora l'audio internamente a 32-bit float. Qual è il vantaggio principale dell'elaborazione in virgola mobile rispetto a quella intera (fixed-point) durante catene di DSP complesse?","o":["Previene il clipping durante i calcoli interni grazie all'enorme margine di manovra (headroom)","Perché i file audio occupano meno spazio nella memoria RAM","Per rendere i suoni compatibili con i monitor HDR"],"c":[0]},{"s":24,"q":"Trigger vs. Data: In MetaSound, qual è la differenza fondamentale tra un input di tipo \"Trigger\" e un input di tipo \"Float\"?","o":["Il Trigger è obbligatorio per i programmatori; il Float è per i sound designer","I Trigger sono eventi istantanei; i Float sono segnali continui.","Il Trigger serve solo per i suoni mono; il Float per quelli stereo"],"c":[1]},{"s":24,"q":"L'Interfaccia MetaSound: Perché useresti un \"Output\" di MetaSound per inviare dati a un Blueprint?","o":["Per collegare fisicamente le casse del computer al motore di gioco","Per esportare il suono come file .WAV durante l'esecuzione del gioco","Per inviare trigger o dati dal MetaSound verso i Blueprint in tempo reale"],"c":[2]},{"s":24,"q":"Perché un inviluppo generato dentro MetaSound è più preciso di uno generato tramite il \"Tick\" di un Blueprint?","o":["Perché MetaSound utilizza la GPU invece della CPU","Perché MetaSound lavora a risoluzione di campione (es. 48.000 volte al secondo), mentre il Tick dipende dal frame rate","Perché i Blueprint non possono gestire valori decimali"],"c":[1]},{"s":24,"q":"Come gestisce MetaSound un \"Delayed Trigger\" se il ritardo cade tra due campioni audio?","o":["Arrotonda il ritardo al frame video più vicino","Calcola l'offset esatto dei campioni per mantenere la precisione temporale","Ignora il trigger per evitare errori di sincronizzazione"],"c":[1]},{"s":24,"q":"Nel nodo Wave Player, cosa permettono di fare i parametri \"Loop Start\" e \"Loop Duration\"?","o":["Cambiare la velocità di riproduzione del file audio","Definire una porzione specifica del file audio da ripetere ciclicamente in modo non distruttivo","Cancellare automaticamente il file audio dalla memoria una volta terminato"],"c":[1]},{"s":24,"q":"Il Clock di Metasound: Stai creando un rhythm game. Perché useresti un Metasound invece di un normale nodo Delay o di una Timeline in un Blueprint?","o":["Crea automaticamente una melodia basata sulla posizione del giocatore","Garantisce la riproduzione dei suoni con precisione al campione, indipendentemente dalle fluttuazioni del frame rate","Permette di caricare file MP3 molto pesanti senza rallentare il gioco"],"c":[1]},{"s":24,"q":"MIDI: quale plugin serve attivare per utilizzare il MIDI in Metasound","o":["MIDI device support","Harmonix","OSC"],"c":[1]},{"s":24,"q":"Come riesce Metasound a mantenere il tempo anche se il gioco ha un calo di prestazioni (lag)?","o":["Utilizza un Thread dedicato","Accelera la velocità del gioco per recuperare il tempo perso","Abbassa la qualità del suono per risparmiare risorse"],"c":[0]},{"s":24,"q":"Qual è l'utilità di un \"Audio Modulation Control Bus\"?","o":["Serve a trasformare un segnale audio in un segnale video","È necessario per far funzionare il microfono del giocatore","Permette di controllare un parametro audio da una fonte esterna, disaccoppiando la logica di gioco dal suono"],"c":[2]},{"s":24,"q":"In una gerarchia di Submix, se applichi un effetto al \"Master Submix\", a chi viene applicato?","o":["A tutti i suoni del gioco che passano attraverso i submix figli","Solo ai suoni che non hanno una spazializzazione 3D","Solo alla musica di sottofondo"],"c":[0]},{"s":24,"q":"Submix Effects: Qual'è la differenza tra un Submix Effects Preset ed un Source Effect Preset","o":["Submix Preset Effect deve essere caricato in un Submix Effect Chain e si applica solo al submix. Source Effect Preset si applica alla sorgente che può essere una Metasound","Nessuna","Source Effect Preset si applica ai materiali"],"c":[0]},{"s":24,"q":"Dry/Wet: cosa controllano nei Submix?","o":["I controlli gestiscono i gain rispettivamente del segnale pulito e del segnale con effetti applicati","Quanto viene distorto il segnale","Il volume globale del submix"],"c":[0]},{"s":24,"q":"Impostazioni di Attenuazione: Qual è la differenza tra \"Attenuation (Volume)\" e \"Attenuation (Spatialization)\" nelle impostazioni di spazializzazione di Unreal?","o":["Volume gestisce il volume della sorgente in base alla distanza dall'ascoltatore, Spatialization gestisce l'angolazione della sorgente rispetto all'ascoltatore","Volu function levelOf(xp){let lv=1,need=100,acc=0;while(xp>=acc+need){acc+=need;lv++;need=100+(lv-1)*50}return{lv,cur:xp-acc,need}}
function mastery(si){const qs=BY_SUBJ[si];if(!qs.length)return 0;let m=0;qs.forEach(q=>{const r=S.qs[q.id];if(r&&r[2])m++});return m/qs.length}
function masteredCount(){let n=0;for(const k in S.qs) if(S.qs[k][2]) n++;return n}
function wrongPool(){return QS.filter(q=>{const r=S.qs[q.id];return r&&!r[2]})}

function touchStreak(){
  const t=today();
  if(S.streak.last===t) return false;
  if(S.streak.last && dayDiff(S.streak.last,t)===1) S.streak.n++; else S.streak.n=1;
  S.streak.last=t; S.streak.best=Math.max(S.streak.best,S.streak.n);
  return true;
}
function liveStreak(){ if(!S.streak.last) return 0; return dayDiff(S.streak.last,today())<=1?S.streak.n:0 }
function addXp(n){
  const before=levelOf(S.xp).lv;
  S.xp+=n;
  if(S.daily.d!==today()) S.daily={d:today(),xp:0};
  const wasGoal=S.daily.xp>=S.goal;
  S.daily.xp+=n;
  const after=levelOf(S.xp).lv;
  return {levelUp:after>before?after:0, goalHit:!wasGoal&&S.daily.xp>=S.goal};
}
function recordAnswer(q,ok){
  const r=S.qs[q.id]||[0,0,0];
  if(ok){r[0]++;r[2]=1}else{r[1]++;r[2]=0}
  S.qs[q.id]=r;
}

/* ---------------- sounds ---------------- */
let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8});
  }catch(e){}
}

function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,col:cols[Math.random()*6|0]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});
  if(++f<220)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

  const rows=[['Livello',x=>x.lv],['XP',x=>x.d.xp],['Corrette esami',x=>x.d.examCorrect],['Esami',x=>x.d.exams.length],['Streak 🔥',x=>x.st],['Traguardi',x=>Object.keys(x.d.badges).length]];
  return `<div class="vs"><div class="r" style="border-top:none"><b>${PROFILES[0].emoji} ${PROFILES[0].id}</b><span>vs</span><b style="text-align:left">${PROFILES[1].emoji} ${PROFILES[1].id}</b></div>
   ${rows.map(([l,f])=>{const x=f(a),y=f(b);return `<div class="r"><b class="${x>y?'w':''}">${x>y?'👑 ':''}${x}</b><span>${l}</span><b style="text-align:left" class="${y>x?'w':''}">${y}${y>x?' 👑':''}</b></div>`}).join('')}</div>`;
}
function pickerCards(){
  return `<div class="picker">${PROFILES.map(p=>{const x=pSummary(p.id);return `<button class="pcard ${p.id===CUR?'cur':''}" style="--pc:${p.col}" onclick="switchProfile('${p.id}')">

/* ---------------- runs ---------------- */
function startSim(){ sTap(); launch({mode:'sim',title:'Simulazione d\'esame',qs:shuffle(IT_QS).slice(0,25).concat(shuffle(EN_QS).slice(0,5)),time:30*60}) }
function startSubject(i){ sTap(); const qs=shuffle(BY_SUBJ[i]).slice(0,30); launch({mode:'subj',subj:i,title:SUBJ[i].name,qs,time:qs.length*60}) }
function startPractice(){ sTap();
  // pesca privilegiando domande mai viste o sbagliate
  const w=QS.map(q=>{const r=S.qs[q.id];return {q,k:Math.random()*(r?(r[2]?1:0.4):0.25)}}).sort((a,b)=>a.k-b.k).slice(0,15).map(x=>x.q);
  launch({mode:'practice',title:'Allenamento lampo',qs:w,hearts:5});
}
function startReview(){ const p=wrongPool(); if(!p.length) return; sTap(); launch({mode:'review',title:'Ripasso errori',qs:shuffle(p).slice(0,20),hearts:5}) }
function launch(o){
  stopRun();
  RUN=Object.assign({i:0,ans:{},start:Date.now(),combo:0,correct:0,done:false,locked:false,queue:o.qs.slice(),first:{}},o);
  VIEW='quiz';render();scrollTo(0,0);
  if(o.time){ timerId=setInterval(tick,500) }
}
function remaining(){return RUN.time-(Date.now()-RUN.start)/1000}
function tick(){
  if(!RUN||RUN.done) return;
  const r=remaining(), el=$('#tm');
  if(el){el.textContent='⏱ '+fmt(r);el.classList.toggle('low',r<60)}
  if(r<=0) finishExam(true);
}

function vQuiz(){
  const R=RUN; if(!R){go('home');return}
  if(R.mode==='sim'||R.mode==='subj') return vExam();
  return vPractice();
}
/* exam (patente style): free navigation, answers revealed at end */
function vExam(){
  const R=RUN,q=R.qs[R.i],n=R.qs.length,answered=Object.keys(R.ans).length;
  $('#view').innerHTML=`
   <div class="qhead"><button class="x" onclick="go('home')">✕</button>
     <div class="bar blue"><i style="width:${answered/n*100}%"></i></div>
     <div class="timer" id="tm">⏱ ${fmt(remaining())}</div></div>
   <div class="qsubj">Domanda ${R.i+1} di ${n} · ${EN_SUBJ.includes(q.s)?'🇬🇧 ':''}${esc(SUBJ[q.s].name)}</div>
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts">${q.o.map((o,k)=>`<button class="opt ${R.ans[R.i]===k?'sel':''}" onclick="pick(${k})"><span class="k">${L[k].toUpperCase()}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div class="navrow"><button class="btn ghost" ${R.i===0?'disabled':''} onclick="nav(-1)">← Indietro</button>
     ${R.i<n-1?`<button class="btn blue" onclick="nav(1)">Avanti →</button>`:`<button class="btn" onclick="confirmEnd()">Consegna</button>`}</div>
   <div class="grid">${R.qs.map((_,k)=>`<button class="${R.ans[k]!==undefined?'ans':''} ${k===R.i?'cur':''}" onclick="jump(${k})">${k+1}</button>`).join('')}</div>
   <div style="margin-top:16px;text-align:center"><button class="btn ghost" onclick="confirmEnd()">Termina e consegna (${answered}/${n})</button></div>
   <p class="note">Puoi cambiare risposta e saltare domande fino alla consegna. ${R.mode==='sim'?'Le domande 26–30 sono in inglese. ':''}Il risultato è un tier in base alle risposte giuste: ${TIERS.slice(0,5).map(t=>t.e+' '+minFor(t,R.qs.length)+'+').join(' · ')}. Le domande senza risposta contano come errori.</p>`;
}
function pick(k){ if(RUN.done)return; tone([[600,.04,'triangle']]); RUN.ans[RUN.i]=k; if(RUN.i<RUN.qs.length-1){render();setTimeout(()=>{if(RUN&&!RUN.done){RUN.i++;render()}},180)} else render(); }
function nav(d){RUN.i=Math.max(0,Math.min(RUN.qs.length-1,RUN.i+d));render()}
function jump(k){RUN.i=k;render()}
function confirmEnd(){
  const miss=RUN.qs.length-Object.keys(RUN.ans).length;
  if(!miss) return finishExam(false);
  modal(`<div style="font-size:50px">📝</div><h2>Consegnare l'esame?</h2><p class="sub">Hai ancora ${miss} domand${miss===1?'a':'e'} senza risposta: verranno contate come errori.</p>
   <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Torna alle domande</button><button class="btn" id="ce">Consegna</button></div>`);
  $('#ce').onclick=()=>{closeModal();finishExam(false)};
}
function finishExam(timeout){
  const R=RUN; if(R.done) return; R.done=true; clearInterval(timerId);
  const dur=Math.min(R.time,(Date.now()-R.start)/1000);
  let c=0; R.qs.forEach((q,k)=>{const a=R.ans[k]; const ok=a!==undefined&&isRight(q,a); if(ok)c++; if(a!==undefined) recordAnswer(q,ok)});
  const n=R.qs.length, err=n-c, tier=tierOf(c,n), pts=c*10+tier.bonus, good=tierIdx(tier)<=2;
  // combo across exam order
  let combo=0,best=0; R.qs.forEach((q,k)=>{if(R.ans[k]!==undefined&&isRight(q,R.ans[k])){combo++;best=Math.max(best,combo)}else combo=0});
  S.bestCombo=Math.max(S.bestCombo,best);
  S.examCorrect+=c; S.examAnswered+=n;
  let xp=pts;
  const newDay=touchStreak();
  const lv=addXp(xp);
  S.exams.push({t:Date.now(),mode:R.mode,subj:R.subj,n,c,tier:tier.k,pts,dur:Math.round(dur)}); if(S.exams.length>200) S.exams.shift();
  checkBadges({tier,sim:R.mode==='sim',perfect:err===0,fast:R.mode==='sim'&&tierIdx(tier)<=1&&dur<600});
  save();
  R.res={c,n,err,tier,pts,xp,dur,timeout,lv,newDay};
  VIEW='result';render();scrollTo(0,0);
  if(good){sWin();confetti()}else if(tierIdx(tier)<=4) sWin(); else sBad();
}
/* practice / review: Duolingo style */
function vPractice(){
  const R=RUN,q=R.queue[0],tot=R.qs.length,doneN=R.qs.length-R.queue.length;
  $('#view').innerHTML=`
   <div class="qhead"><button class="x" onclick="go('home')">✕</button>
     <div class="bar"><i style="width:${doneN/tot*100}%"></i></div>
     <div class="hearts" id="hp">❤️ ${R.hearts}</div></div>
   <div class="qsubj">${R.first[q.id]===false?'🔁 Ritenta · ':''}${esc(SUBJ[q.s].name)}${R.combo>=3?` <span class="combo">🔥 x${R.combo}</span>`:''}</div>
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts" id="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" onclick="selP(${k})"><span class="k">${L[k].toUpperCase()}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div style="margin-top:18px"><button class="btn full" id="chk" disabled onclick="checkP()">Verifica</button></div>`;
  R.sel=null;R.locked=false;
}
function selP(k){ if(RUN.locked)return; sTap(); RUN.sel=k; document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k===k)); $('#chk').disabled=false }
function checkP(){
  const R=RUN; if(R.locked||R.sel==null) return; R.locked=true;
  const q=R.queue[0], ok=isRight(q,R.sel), firstTry=R.first[q.id]===undefined;
  if(firstTry){ R.first[q.id]=ok; recordAnswer(q,ok) } else if(ok){ recordAnswer(q,true) }
  document.querySelectorAll('#opts .opt').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(q.c.includes(k))b.classList.add('good');else if(k===R.sel)b.classList.add('bad')});
  $('#chk').style.visibility='hidden';
  let gained=0;
  if(ok){ R.combo++; R.correct++; S.practiceCorrect++; S.bestCombo=Math.max(S.bestCombo,R.combo); gained=5+Math.min(10,Math.floor(R.combo/3)*2); R.xp=(R.xp||0)+gained; R.queue.shift(); sGood(); }
  else { R.combo=0; R.hearts--; R.queue.push(R.queue.shift()); sBad(); const hp=$('#hp'); if(hp) hp.textContent='❤️ '+R.hearts; }
  const praise=['Ottimo!','Grande!','Perfetto!','Esatto!','Fantastico!','Bravissimo!'][Math.random()*6|0];
  const cor=q.c.map(k=>q.o[k]).join(' / ');
  showSheet(ok,`<h3>${ok?'✅ '+praise:'❌ Risposta sbagliata'}${ok&&R.combo>=3?`<span class="combo">🔥 Combo x${R.combo}</span>`:''}</h3>
    <p>${ok?`+${gained} XP`:`Risposta corretta: <b>${esc(cor)}</b>${R.hearts>0?' — la ritroverai più avanti.':''}`}</p>
    <button class="btn ${ok?'':'red'} full" id="cont">Continua</button>`);
  $('#cont').onclick=()=>{hideSheet(); if(R.hearts<=0||!R.queue.length) finishPractice(); else render()};
}
function showSheet(ok,h){const s=$('#sheet');s.className='sheet '+(ok?'ok':'ko');$('#sheetIn').innerHTML=h;requestAnimationFrame(()=>s.classList.add('show'))}
function hideSheet(){$('#sheet').classList.remove('show')}
function finishPractice(){
  const R=RUN; R.done=true;
  const win=R.hearts>0, firstOk=Object.values(R.first).filter(Boolean).length;
  let xp=(R.xp||0)+(win?20:0)+(win&&R.hearts===5?30:0);
  const newDay=touchStreak();
  const lv=addXp(xp);
  checkBadges({review:R.mode==='review'&&win});
  save();
  R.res={win,xp,firstOk,n:R.qs.length,lv,newDay,dur:(Date.now()-R.start)/1000};
  VIEW='result';render();scrollTo(0,0);
  if(win){sWin();confetti()}else sBad();
}

function vResult(){
  const R=RUN; if(!R||!R.res){go('home');return}
  const r=R.res; let h='';
  const extra=`${r.lv.levelUp?`<div class="card" style="background:var(--gold-l);border-color:var(--gold)">🎉 <b>Sei salito al livello ${r.lv.levelUp}!</b></div>`:''}
    ${r.lv.goalHit?`<div class="card" style="background:var(--orange-l);border-color:var(--orange)">🎯 <b>Obiettivo giornaliero raggiunto!</b></div>`:''}
    ${r.newDay?`<div class="card" style="background:var(--orange-l);border-color:var(--orange)">🔥 <b>Streak: ${liveStreak()} giorn${liveStreak()===1?'o':'i'} di fila!</b></div>`:''}`;
  if(R.mode==='sim'||R.mode==='subj'){
    h=`<div class="card result">
      <div class="tiermedal" style="--tc:${r.tier.col}">${r.tier.e}</div>
      <div class="sub" style="text-transform:uppercase;letter-spacing:1px">Tier ${r.tier.k}</div>
      <h1 style="color:${r.tier.col}">${r.tier.name}</h1>
      <p class="sub">${r.timeout?'⏰ Tempo scaduto! ':''}${esc(R.title)}</p>
      <div class="reward"><div><b style="color:var(--gold)">${r.pts}</b><span>Punti</span></div><div><b class="ok-t">${r.c}/${r.n}</b><span>Corrette</span></div><div><b style="color:var(--blue)">${fmt(r.dur)}</b><span>Tempo</span></div></div>
      <div class="sub" style="margin-bottom:10px">${r.c} × 10 pt + bonus tier ${r.tier.bonus} pt</div>
      <div class="ladder">${TIERS.map(t=>`<div class="${t===r.tier?'on':''}" style="--tc:${t.col}"><span>${t.e}</span><b>${t.name}</b><small>${minFor(t,r.n)}+ · +${t.bonus}</small></div>`).join('')}</div>
      ${tierIdx(r.tier)>0?`<div class="sub" style="margin-top:10px">${minFor(TIERS[tierIdx(r.tier)-1],r.n)-r.c===1?'Ti manca':'Ti mancano'} <b style="color:${TIERS[tierIdx(r.tier)-1].col}">${minFor(TIERS[tierIdx(r.tier)-1],r.n)-r.c}</b> ${minFor(TIERS[tierIdx(r.tier)-1],r.n)-r.c===1?'risposta giusta':'risposte giuste'} per ${TIERS[tierIdx(r.tier)-1].e} ${TIERS[tierIdx(r.tier)-1].name}</div>`:''}
      <div class="sub">Totale risposte corrette in tutti gli esami: <b class="ok-t">${S.examCorrect}</b></div>
      <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="go('home')">Home</button>
       <button class="btn" onclick="${R.mode==='sim'?'startSim()':'startSubject('+R.subj+')'}">Riprova</button></div>
    </div>${extra}
    <div class="card"><h2>Correzione</h2><div class="tabs" id="revt"><button class="on" data-f="err">Solo errori (${r.err})</button><button data-f="all">Tutte</button></div><div id="revl"></div></div>`;
    $('#view').innerHTML=h;
    const draw=f=>{$('#revl').innerHTML=R.qs.map((q,k)=>({q,k,a:R.ans[k]})).filter(x=>f==='all'||!(x.a!==undefined&&isRight(x.q,x.a))).map(({q,k,a})=>{
      const ok=a!==undefined&&isRight(q,a);
      return `<div class="rev"><div class="q">${ok?'✅':'❌'} ${k+1}. ${esc(q.q)}</div><span class="chip">${esc(SUBJ[q.s].name)}</span>
       ${a===undefined?'<div class="a r" style="text-decoration:none">Nessuna risposta</div>':(!ok?`<div class="a r">${L[a]}. ${esc(q.o[a])}</div>`:'')}
       ${q.c.map(ci=>`<div class="a g">✔ ${L[ci]}. ${esc(q.o[ci])}</div>`).join('')}</div>`}).join('')||'<p class="sub">Nessun errore, complimenti! 💎</p>'};
    document.querySelectorAll('#revt button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#revt button').forEach(x=>x.classList.toggle('on',x===b));draw(b.dataset.f)});
    draw('err');
  } else {
    h=`<div class="card result">
      <div class="big">${r.win?'🏆':'💔'}</div>
      <h1>${r.win?'Sessione completata!':'Vite esaurite'}</h1>
      <p class="sub">${esc(R.title)}</p>
      <div class="reward"><div><b class="ok-t">${r.firstOk}/${r.n}</b><span>Al primo colpo</span></div><div><b style="color:var(--gold)">+${r.xp}</b><span>XP</span></div><div><b style="color:var(--red)">${'❤️'.repeat(Math.max(0,R.hearts))||'0'}</b><span>Vite rimaste</span></div></div>
      <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="go('home')">Home</button>
       <button class="btn" onclick="${R.mode==='review'?'startReview()':'startPractice()'}">Ancora!</button></div>
    </div>${extra}`;
    $('#view').innerHTML=h;
  }
}

render();
</script>
</body>
</html>
